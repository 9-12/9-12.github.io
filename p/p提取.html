<!DOCTYPE html>
<html lang="zh">
 
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>仓鼠云盘</title>
    <style>

        body{
            display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			flex-direction: column;
			gap: 30px;
            background-color: #222;
        }

        @keyframes pageimg {
            from {
                box-shadow:0px 0px 0px #28914a;
            }

            to {
                box-shadow:0px 0px 30px #28914a;
            }
        }

        .btn{
            width: 130px;
            height: 40px;
            font-size: 17px;

			/* global 94%+ browsers support */
			background: linear-gradient(155deg,#9BE15D 7.12%,#00E3AE 100%); 
			/* safari 5.1+,chrome 10+ */
			background: -webkit-linear-gradient(155deg,#9BE15D 7.12%,#00E3AE 100%);
			/* ff 3.6+ */
			background: -moz-linear-gradient(155deg,#9BE15D 7.12%,#00E3AE 100%);
			/* opera 11.10+ */ 
			background: -o-linear-gradient(155deg,#9BE15D 7.12%,#00E3AE 100%);
			/* ie 10+ */
			background: -ms-linear-gradient(155deg,#9BE15D 7.12%,#00E3AE 100%);

            border-color: #28914a;
            border-radius: 10px;
            padding: center;
            display: block;
            margin: auto;
        }

        .pageimg {
            margin:300px;
            width: 300px;
            margin:20px;
            animation: pageimg 2s ease-in-out infinite alternate;
        }

        h2{
            color: #fff;
            font-weight: bolder;
        }

		.tiqu{
            font-weight: bolder;
            color: #fff;
        }
	</style>
    <script>
        function redirectToSite() {
            window.location.href = '';
        }
    </script>
</head>
<body>
        <h2 class="pagetitle">标题</h2>
		<div>
			<button class="btn" onclick="redirectToSite()"><a class="tiqu">提取</a></button>
		</div>
</body>
</html>
